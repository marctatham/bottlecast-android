[versions]
pluginAndroidGradle = "9.4.1"
pluginKotlin = "2.4.21"
pluginKsp = "2.3.12"
pluginHilt = "2.60.1"
pluginGoogleServices = "4.5.0"
pluginFirebaseCrashlytics = "3.0.8"
coroutines = "1.11.0"
androidxCore = "1.19.1"
androidxLifecycle = "2.11.0"
androidxActivity = "1.13.0"
androidxComposeBom = "2026.09.00"
androidxComposeMaterial3 = "1.5.0-beta01" # ahead of the BOM's 1.4.0 for MotionScheme.expressive() and MaterialShapes (decisions.md, 2026-10-13); drop when the BOM ships 1.5
androidxHilt = "1.4.0"
androidxNavigation = "2.10.2"
androidxCredentials = "1.6.0"
androidxTest = "1.7.0"
androidxTestExt = "1.3.0"
androidxTestRunner = "1.7.0"
androidxTestEspresso = "3.7.0"
junit = "4.13.2"
mockk = "1.14.11"
timber = "5.0.1"
lottie = "6.7.1"
googleId = "1.2.1"
firebase = "35.0.0"
roborazzi = "1.76.0"
robolectric = "4.17"

[libraries]
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "pluginKotlin" } # AGP bundles an older KGP; this pins the one used by built-in Kotlin
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "androidxComposeBom" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "androidxComposeMaterial3" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-credentials = { module = "androidx.credentials:credentials", version.ref = "androidxCredentials" }
androidx-credentials-play-services-auth = { module = "androidx.credentials:credentials-play-services-auth", version.ref = "androidxCredentials" } # Credential Manager's Google Play services provider, required on Android 13 & below
androidx-hilt-lifecycle-viewmodel-compose = { module = "androidx.hilt:hilt-lifecycle-viewmodel-compose", version.ref = "androidxHilt" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "androidxNavigation" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTest" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExt" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidxTestEspresso" } # Roborazzi brings 3.5.1, which can't inject input on API 34+
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "pluginHilt" }
hilt-android-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "pluginHilt" }
hilt-android-testing = { module = "com.google.dagger:hilt-android-testing", version.ref = "pluginHilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "pluginHilt" }
junit = { module = "junit:junit", version.ref = "junit" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "pluginKotlin" }
timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }
airbnb-lottie = { module = "com.airbnb.android:lottie", version.ref = "lottie" }
airbnb-lottie-compose = { module = "com.airbnb.android:lottie-compose", version.ref = "lottie" }
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebase" } # when using the BoM, don't specify versions in the Firebase dependencies
firebase-analytics = { module = "com.google.firebase:firebase-analytics" }
firebase-auth = { module = "com.google.firebase:firebase-auth" }
firebase-firestore = { module = "com.google.firebase:firebase-firestore" }
firebase-crashlytics = { module = "com.google.firebase:firebase-crashlytics" }
googleid = { module = "com.google.android.libraries.identity.googleid:googleid", version.ref = "googleId" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
androidx-compose-material-iconsExtended = { module = "androidx.compose.material:material-icons-extended" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
roborazzi = { module = "io.github.takahirom.roborazzi:roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { module = "io.github.takahirom.roborazzi:roborazzi-compose", version.ref = "roborazzi" }

[plugins]
android-application = { id = "com.android.application", version.ref = "pluginAndroidGradle" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "pluginKotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "pluginKsp" }
hilt-gradle = { id = "com.google.dagger.hilt.android", version.ref = "pluginHilt" }
google-services = { id = "com.google.gms.google-services", version.ref = "pluginGoogleServices" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "pluginFirebaseCrashlytics" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
